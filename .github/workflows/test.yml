name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise cache date
        run: echo "MISE_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          # Retain mise-action's platform and config dimensions while rotating
          # mutable tool-selector caches each UTC day.
          cache_key: "{{default}}-{{env.MISE_CACHE_DATE}}"
        env:
          # Serialize installation without changing test and lint behavior.
          MISE_JOBS: 1

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: mise run test

      - name: Run codebase lints
        run: codebase lint "$PWD"

      - name: Check README.md is up to date
        uses: KnickKnackLabs/readme@v0.3.1
        with:
          check: true
