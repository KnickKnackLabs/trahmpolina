name: Temporary BATS parallel benchmark

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve mise cache epoch
        id: mise-cache-epoch
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          cache_key: mise-v2-${{ steps.mise-cache-epoch.outputs.value }}-{{platform}}-{{file_hash}}
        env:
          MISE_JOBS: 1

      - name: Generate isolated benchmark profiles
        run: python3 .benchmark/generate.py

      - name: Measure cross-file candidates
        run: |
          python3 .benchmark/benchmark.py "$(mise which bats)" "$(mise which rush)" | tee .benchmark/summary.out
          {
            echo '## ${{ matrix.os }} BATS parallel candidates'
            echo '```json'
            cat .benchmark/summary.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
